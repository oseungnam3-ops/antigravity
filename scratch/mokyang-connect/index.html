<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="파주목양교회 공동체를 연결하는 따뜻한 디지털 목양 플랫폼, 목양커넥트(Mokyang Connect)">
  <meta name="theme-color" content="#1A365D">
  <title>목양커넥트 - Mokyang Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Mobile App Frame Container -->
  <div id="app-container">
    
    <!-- Top App Header -->
    <header class="app-header" id="app-header-main">
      <div class="logo-section">
        <div class="logo-icon">⛪</div>
        <span class="logo-text">목양커넥트</span>
      </div>
      <div class="header-actions">
        <!-- Accessibility: Large Font Toggle for Elderly -->
        <button class="text-scale-btn" id="btn-text-scale" aria-label="글씨 크기 조정">
          <span>가+</span> 큰 글씨
        </button>
        <!-- Prototype Helpers: Current Role Badge -->
        <div class="role-badge" id="header-role-badge">성도</div>
      </div>
    </header>

    <!-- Prototype Role Quick Switcher Panel -->
    <div id="role-selector-container" style="background-color: var(--primary-dark); padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);">
      <!-- Generated by app.js -->
    </div>

    <!-- Scrollable Main View Area -->
    <main class="app-content" id="dynamic-content" aria-label="메인 콘텐츠 영역">
      <!-- Pages rendered dynamically here -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="app-nav" id="app-navigation-bottom" aria-label="하단 메뉴">
      <button class="nav-item active" data-page="home" id="nav-home" aria-label="홈 화면으로 이동">
        <svg viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>홈</span>
      </button>
      <button class="nav-item" data-page="groups" id="nav-groups" aria-label="소모임 화면으로 이동">
        <svg viewBox="0 0 24 24">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        <span>소모임</span>
      </button>
      <button class="nav-item" data-page="calendar" id="nav-calendar" aria-label="일정 화면으로 이동">
        <svg viewBox="0 0 24 24">
          <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
        </svg>
        <span>일정</span>
      </button>
      <button class="nav-item" data-page="notifications" id="nav-notifications" aria-label="알림 화면으로 이동">
        <svg viewBox="0 0 24 24">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
        <span>알림</span>
      </button>
      <button class="nav-item" data-page="profile" id="nav-profile" aria-label="내 정보 화면으로 이동">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <span>내 정보</span>
      </button>
    </nav>
    
  </div>

  <!-- Interactive Dialog / Modal Overlay (Global) -->
  <div class="modal-overlay" id="general-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="color: var(--primary); font-weight: 800;">제목</h3>
        <button class="btn btn-outline btn-icon-only btn-sm" onclick="closeModal()" aria-label="닫기" style="border: none; font-size: 16px;">✕</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Content will be injected dynamically -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">취소</button>
        <button class="btn btn-accent" id="modal-confirm-btn">확인</button>
      </div>
    </div>
  </div>

  <!-- Core Logic JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
